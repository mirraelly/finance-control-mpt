server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = / {
        return 302 /finance-control/;
    }

    location /finance-control/api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /finance-control/api;
        proxy_read_timeout 120s;
    }

    location /finance-control/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /finance-control/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /finance-control/index.html;
    }
}
